spring:
  application:
    name: oficina-flow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: always

app:
  jwt:
    secret: ${APP_JWT_SECRET:desenvolvimento-local-segredo-nao-usar-em-producao-precisa-64-chars-ok}
    access-ttl-minutos: 60
    refresh-ttl-dias: 7
  admin:
    email: ${APP_ADMIN_EMAIL:dono@oficina.local}
    senha: ${APP_ADMIN_SENHA:oficina123}
    nome: ${APP_ADMIN_NOME:Dono da Oficina}
  carga-demo: ${APP_CARGA_DEMO:false}
  cors-origens: ${APP_CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
  url-publica: ${APP_URL_PUBLICA:http://localhost:5173}
  uploads-dir: ${APP_UPLOADS_DIR:./dados/uploads}
  rate-limit-publico-por-minuto: ${APP_RATE_LIMIT_PUBLICO:60}
  # Minimo de caracteres da senha. O padrao seguro e 6; baixe apenas em teste.
  senha-minima: ${APP_SENHA_MINIMA:6}
  # Caixa de onde as leituras do scanner sao lidas. Sem credencial aqui, o
  # job nem tenta conectar — ligar a chave em Configuracoes nao basta.
  imap:
    host: ${APP_IMAP_HOST:}
    porta: ${APP_IMAP_PORTA:993}
    usuario: ${APP_IMAP_USUARIO:}
    senha: ${APP_IMAP_SENHA:}
    ssl: ${APP_IMAP_SSL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    br.com.oficina: INFO
